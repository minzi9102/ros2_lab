pen_writing_visualizer_node:
  ros__parameters:
    world_frame: base_link
    paper_frame: paper_frame
    marker_topic: /pen_writing/markers
    joy_topic: /joy
    publish_rate_hz: 60.0
    joy_deadzone: 0.08
    joy_timeout_sec: 0.25
    max_planar_speed_mps: 0.08
    acceleration_mps2: 0.08
    deceleration_mps2: 0.16
    yaw_hold_speed_mps: 0.005
    tilt_activate_speed_mps: 0.01
    tilt_rate_degps: 45.0
    untilt_rate_degps: 60.0
    max_pen_axis_angular_speed_degps: 55.0
    pen_length_m: 0.14
    tool0_to_pen_tip_xyz: [0.0, 0.0, 0.14]
    pen_radius_m: 0.006
    pen_tip_radius_m: 0.01
    target_pen_tip_axis_length_m: 0.08
    fixed_tilt_deg: 20.0
    paper_width_m: 0.24
    paper_height_m: 0.16
    paper_origin_xyz: [0.45, 0.0, 0.12]
    initial_tip_xy: [0.0, 0.0]

pen_fakehardware_servo:
  ros__parameters:
    paper_origin_xyz: [0.45, 0.0, 0.12]
    tool0_to_pen_tip_xyz: [0.0, 0.0, 0.14]
    max_pen_axis_angular_speed_degps: 55.0
    target_pen_tip_axis_length_m: 0.08
    tool0_axis_length_m: 0.08
    tool_position_tolerance_m: 0.005
    tool_orientation_tolerance_deg: 3.0
    pose_settle_speed_mps: 0.002
    pose_settle_tilt_deg: 0.5
    servo_status_topic: /servo_node/status
    servo_status_timeout_sec: 1.0
    servo_status_warn_period_sec: 1.0
