ur3e_keyboard_servo:
  ros__parameters:
    command_topic: /servo_node/delta_twist_cmds
    command_type_service: /servo_node/switch_command_type
    frame_id: base_link
    publish_rate_hz: 30.0
    key_timeout_sec: 0.15
    linear_speed_mps: 0.005
    enable_z: false
    enable_rotation: false
    require_confirmation: true
    human_confirmation: ""
    required_confirmation_text: I_CONFIRM_REAL_ROBOT_MOTION
    max_session_duration_sec: 30.0
