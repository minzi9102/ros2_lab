    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    max_joint_delta_rad: 3.20
    final_position_tolerance_rad: 0.03
    final_state_timeout_sec: 5.0
