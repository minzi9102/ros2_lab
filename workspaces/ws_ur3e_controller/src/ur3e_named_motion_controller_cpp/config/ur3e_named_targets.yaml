schema_version: 1

runtime_modes:
  sim:
    planning_group: ur_manipulator
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    max_joint_delta_rad: 3.20
    final_position_tolerance_rad: 0.03
    final_state_timeout_sec: 5.0
    planning_time_sec: 3.0
    planning_attempts: 3
    max_velocity_scaling: 0.10
    max_acceleration_scaling: 0.10
    require_joint_state_stamp: false
    required_active_controllers:
      - joint_state_broadcaster
      - scaled_joint_trajectory_controller
    targets:
      home:
        enabled: true
        reviewed_by: "simulation baseline"
        positions_rad: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
      ready:
        enabled: true
        reviewed_by: "simulation +30deg shoulder_pan and -30deg elbow"
        positions_rad: [0.5236, -1.5708, 1.0472, -1.5708, -1.5708, 0.0]

  real:
    planning_group: ur_manipulator
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    max_joint_delta_rad: 0.60
    final_position_tolerance_rad: 0.02
    final_state_timeout_sec: 5.0
    planning_time_sec: 3.0
    planning_attempts: 3
    max_velocity_scaling: 0.05
    max_acceleration_scaling: 0.05
    require_joint_state_stamp: true
    require_remote_control: true
    allow_reduced_safety_mode: false
    min_speed_scaling: 0.01
    required_active_controllers:
      - joint_state_broadcaster
      - scaled_joint_trajectory_controller
    targets:
      # TODO(human): 真机目标值必须由现场人员重新审核后才能 enabled=true；
      # 这里保留 Task 8D 的 home/ready 作为迁移参考，逐个审核后才允许启用。
      home:
        enabled: true
        reviewed_by: "minzi 2026-06-09 现场复核，当前 ready 姿态作为新基线"
        positions_rad: [0.5235722064971924, -1.5707042559409565, 1.0472167173968714, -1.5708304844298304, -1.5708978811847132, -0.00009566942323857575]
      ready:
        enabled: true
        reviewed_by: "minzi 2026-06-09 在新基线下对齐 sim.ready 的 +30deg shoulder_pan / -30deg elbow"
        positions_rad: [1.0471722064971923, -1.5707042559409565, 0.5236167173968715, -1.5708304844298304, -1.5708978811847132, -0.00009566942323857575]
